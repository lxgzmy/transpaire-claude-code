[project]
name = "osc-api-mcp"
version = "0.1.0"
description = "MCP server bridging Claude Code to the Companion Systems OSC API (OSCAPI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x negotiates the 2026-07-28 MCP protocol, which Claude Code
    # (CLI 2.1.x) rejects at the initialize handshake — stay on 1.x.
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
osc-api-mcp = "osc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osc_mcp"]
